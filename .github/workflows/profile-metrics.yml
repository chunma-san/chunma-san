name: Public profile metrics
on:
  schedule:
    - cron: '37 6 * * *'
  workflow_dispatch:
  push:
    paths:
      - scripts/profile_metrics.py
      - .github/workflows/profile-metrics.yml
permissions:
  contents: write
concurrency:
  group: profile-metrics
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Render public GitHub data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/profile_metrics.py
      - name: Commit changed cards only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/metrics-*.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public profile metrics'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
